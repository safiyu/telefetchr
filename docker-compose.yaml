services:
  telefetchr:
    build: .
    container_name: telefetchr
    ports:
      - "9868:9868"
    # To share a network with a VPN sidecar instead, replace `ports` above with:
    #   network_mode: "container:vpn"
    # and configure TRUSTED_PROXIES accordingly (e.g. the VPN container's IP).
    volumes:
      - ./sessions:/app/sessions
      - ./downloads:/app/downloads
    environment:
      - PYTHONUNBUFFERED=1
      - API_ID=1234567
      - API_HASH=yourapihash
      - PHONE_NUMBER=1234567890
      # Authentication (IMPORTANT: Change these in production!)
      - SECRET_KEY=telefetchr-secure-dev-key-12345
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - PUID=1000
      - PGID=1000
      - TRUSTED_SUBNETS=192.168.1.0/24
    restart: unless-stopped
