<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: blob: https://www.transparenttextures.com; connect-src 'self'; base-uri 'self'; form-action 'self'">
    <title>Login — TeleFetchr</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0f172a;
            --bg-card: #1e293b;
            --bg-subcard: #0b1120;
            --accent-gold: #fcd34d;
            --accent-gold-hover: #fbbf24;
            --accent-cyan: #38bdf8;
            --ink: #000000;
        }

        * {
            font-family: 'Outfit', sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace !important;
        }

        body {
            background-color: var(--bg-canvas);
            color: #f8fafc;
            background-image:
                radial-gradient(rgba(56, 189, 248, 0.10) 1px, transparent 1px),
                url("/static/images/stardust.png");
            background-size: 18px 18px, auto;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
        }

        /* Cyber-Comic 2.0 Neo-Brutalist Shell */
        .login-card {
            background: var(--bg-card);
            border: 2.5px solid var(--ink);
            border-radius: 16px;
            box-shadow: 7px 7px 0px var(--ink);
            width: 100%;
            max-width: 430px;
            overflow: hidden;
            animation: kapow 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .login-topbar {
            background: #0b1120;
            border-bottom: 2.5px solid var(--ink);
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .window-dots {
            display: flex;
            gap: 6px;
        }

        .window-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 1.5px solid var(--ink);
        }

        .login-body {
            padding: 2.25rem 2rem 2rem;
        }

        @keyframes kapow {
            0% {
                transform: scale(0.92) translateY(8px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.15s ease;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: var(--bg-subcard) !important;
            border: 2px solid var(--ink) !important;
            border-radius: 10px !important;
            font-size: 0.95rem;
            font-weight: 500;
            color: #f8fafc !important;
            transition: all 0.15s ease;
            outline: none;
            box-shadow: 3px 3px 0px var(--ink) !important;
        }

        .input-group input:focus {
            border-color: var(--accent-gold) !important;
            box-shadow: 4px 4px 0px var(--ink) !important;
            transform: translate(-1px, -1px);
        }

        .input-group input:focus + i,
        .input-wrapper:focus-within i {
            color: var(--accent-gold);
        }

        .input-group input::placeholder {
            color: #475569;
        }

        .btn-login {
            width: 100%;
            padding: 13px 16px;
            background: var(--accent-gold);
            border: 2.5px solid var(--ink);
            color: var(--ink);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 4px 4px 0px var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--ink);
            background: var(--accent-gold-hover);
        }

        .btn-login:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--ink);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
            background: #94a3b8;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.75rem;
            padding: 1rem;
            background: var(--bg-subcard);
            border: 2px solid var(--ink);
            border-radius: 12px;
            box-shadow: 3px 3px 0px var(--ink);
        }

        .logo-box img {
            width: 58px;
            height: 58px;
            border: 2px solid var(--ink);
            border-radius: 12px;
            box-shadow: 2px 2px 0px var(--ink);
            flex-shrink: 0;
            object-fit: cover;
        }

        .logo-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-shadow: 2px 2px 0px var(--ink);
            line-height: 1.1;
        }

        .logo-sub {
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 0.25rem;
        }

        .footer-note {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 2px dashed rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .badge-brutal {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(52, 211, 153, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.7rem;
            color: #34d399;
            border: 2px solid var(--ink);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 2px 2px 0px var(--ink);
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 1.25rem;
            font-weight: 700;
            font-size: 0.85rem;
            border: 2px solid var(--ink);
            box-shadow: 3px 3px 0px var(--ink);
            display: none;
        }

        .alert-error {
            background-color: #7f1d1d;
            color: #fecaca;
        }

        .alert-success {
            background-color: #064e3b;
            color: #a7f3d0;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(0, 0, 0, 0.25);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <!-- Neo-Brutalist Window Header Strip -->
        <div class="login-topbar">
            <div class="window-dots">
                <span class="window-dot" style="background: #fb7185;"></span>
                <span class="window-dot" style="background: #fcd34d;"></span>
                <span class="window-dot" style="background: #34d399;"></span>
            </div>
            <span class="font-mono text-xs font-bold uppercase tracking-widest text-gray-400">AUTH // GATEWAY</span>
        </div>

        <div class="login-body">
            <div class="logo-box">
                <img src="/static/images/logo.png" alt="TeleFetchr Logo">
                <div>
                    <h1 class="logo-title">TeleFetchr</h1>
                    <p class="logo-sub">Telegram Media Ingest</p>
                </div>
            </div>

            <div id="alert" class="alert"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Operator Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
                        <i class="fa-solid fa-user-astronaut"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Access Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                        <i class="fa-solid fa-key"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span>Unlock Workspace</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="footer-note">
                <div class="badge-brutal">
                    <i class="fa-solid fa-shield-halved text-xs"></i> JWT Protected
                </div>
                <span class="font-mono text-xs text-gray-500">MTProto v2</span>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const alert = document.getElementById('alert');

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 3000);
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> <span>Authenticating...</span>';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        password
                    }),
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    showAlert('Login successful! Redirecting...', 'success');

                    setTimeout(() => {
                        window.location.href = '/app';
                    }, 800);
                } else {
                    let errorMessage = 'Login failed. Please check your credentials.';
                    try {
                        const responseClone = response.clone();
                        const error = await responseClone.json();
                        errorMessage = error.detail || errorMessage;
                    } catch (parseError) {
                        console.error('Non-JSON error response');
                        errorMessage = `Server error (${response.status}). Please try again later.`;
                    }
                    showAlert(errorMessage, 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>Unlock Workspace</span> <i class="fa-solid fa-arrow-right"></i>';
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('An error occurred. Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Unlock Workspace</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        });

        window.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('access_token');
            if (token) {
                try {
                    const response = await fetch('/status', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        window.location.href = '/app';
                    } else {
                        localStorage.removeItem('access_token');
                    }
                } catch (error) {
                    localStorage.removeItem('access_token');
                }
            }
        });
    </script>
</body>

</html>
