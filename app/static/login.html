<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TeleFetchr</title>
    <link rel="icon" type="image/png" href="/static/images/favicon.png" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #131e32;
            color: #f1f5f9;
            background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
            /* Subtle paper grain */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Comic Panel Design */
        .login-card {
            background: #1e293b;
            border: 2px solid #000;
            border-radius: 16px;
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.5);
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            animation: kapow 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes kapow {
            0% {
                transform: scale(0.8) rotate(-2deg);
                opacity: 0;
            }

            50% {
                transform: scale(1.05) rotate(1deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #9ca3af;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a !important;
            border: 1.5px solid #000 !important;
            border-radius: 10px !important;
            font-size: 0.95rem;
            color: #f1f5f9 !important;
            transition: all 0.2s ease;
            outline: none;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.3) !important;
        }

        .input-group input:focus {
            border-color: #fcd34d !important;
            box-shadow: 3px 3px 0px #000 !important;
        }

        .input-group input::placeholder {
            color: #475569;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #fcd34d;
            border: 2px solid #000;
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 3px 3px 0px #000;
            text-shadow: none;
        }

        .btn-login:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000;
            background: #fbbf24;
        }

        .btn-login:active {
            transform: translate(0, 0);
            box-shadow: 2px 2px 0px #000;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            background: #9ca3af;
        }

        .logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo img {
            width: 80px;
            height: 80px;
            margin-bottom: 1rem;
            border: 2px solid #000;
            border-radius: 50%;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.4);
        }

        .logo h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fcd34d;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .footer-note {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid #000;
            text-align: center;
        }

        .footer-note .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.75rem;
            color: #4ade80;
            border: 1.5px solid #000;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.3);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            border: 2px solid #000;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-color: #000;
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border-color: #000;
        }

        /* Spinner update */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo">
            <img src="/static/images/logo.png" alt="TeleFetchr Logo">
            <h1>TeleFetchr</h1>
            <p>Secure File Access</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                Sign In
            </button>
        </form>

        <div class="footer-note">
            <div class="badge">
                <i class="fa-solid fa-lock text-xs"></i> Secure Environment
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const alert = document.getElementById('alert');

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 3000);
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        password
                    }),
                });

                if (response.ok) {
                    const data = await response.json();

                    // Store the token
                    localStorage.setItem('access_token', data.access_token);

                    showAlert('Login successful! Redirecting...', 'success');

                    // Redirect to app
                    setTimeout(() => {
                        window.location.href = '/app';
                    }, 1000);
                } else {
                    let errorMessage = 'Login failed. Please check your credentials.';
                    try {
                        const responseClone = response.clone();
                        const error = await responseClone.json();
                        errorMessage = error.detail || errorMessage;
                    } catch (parseError) {
                        // Response is not JSON (e.g., HTML error page or plain text)
                        console.error('Non-JSON error response');
                        errorMessage = `Server error(${response.status}). Please try again later.`;
                    }
                    showAlert(errorMessage, 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Sign In';
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('An error occurred. Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Sign In';
            }
        });

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('access_token');
            if (token) {
                try {
                    // Try to access a protected endpoint to verify token
                    const response = await fetch('/status', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.ok) {
                        // Token is valid, redirect to app
                        window.location.href = '/app';
                    } else {
                        // Token is invalid, remove it
                        localStorage.removeItem('access_token');
                    }
                } catch (error) {
                    // Token check failed
                    localStorage.removeItem('access_token');
                }
            }
        });
    </script>
</body>

</html>
